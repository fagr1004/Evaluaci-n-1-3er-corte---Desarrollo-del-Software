<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión y Auditoría NAP - FTTH GPON (Municipio Plaza)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cabecera del Sistema -->
    <header>
        <div class="logo">
            <h1>FTTH-GPON Manager</h1>
            <span>Auditoría Técnica - Municipio Plaza</span>
        </div>
        <div class="user-profile">
            <span>Técnico Auditor</span>
        </div>
    </header>

    <div class="app-layout">
        <!-- Barra Lateral de Navegación -->
        <aside>
            <nav>
                <ul>
                    <li><a href="#" class="active">Dashboard</a></li>
                    <li><a href="#">Auditoría NAP</a></li>
                    <li><a href="#">Inventario de Puertos</a></li>
                    <li><a href="#">Reportes</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Contenido Principal -->
        <main>
            <!-- Panel de Estadísticas Rápidas -->
            <section class="stats-overview">
                <div class="stat-card">
                    <h3>Cajas NAP Totales</h3>
                    <p class="stat-value">48</p>
                </div>
                <div class="stat-card">
                    <h3>Puertos Activos</h3>
                    <p class="stat-value">312</p>
                </div>
                <div class="stat-card">
                    <h3>Puertos Libres</h3>
                    <p class="stat-value">72</p>
                </div>
                <div class="stat-card">
                    <h3>Alertas / Incidencias</h3>
                    <p class="stat-value">3</p>
                </div>
            </section>

            <!-- Formulario de Registro / Auditoría de Caja NAP -->
            <section class="audit-section">
                <h2>Formulario de Auditoría - Caja NAP</h2>
                <form id="nap-audit-form">
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="nap-code">Código de Caja NAP</label>
                            <input type="text" id="nap-code" name="nap_code" placeholder="Ej: NAP-PLAZA-042" required>
                        </div>
                        <div class="form-group">
                            <label for="sector">Sector / Urbanización</label>
                            <input type="text" id="sector" name="sector" placeholder="Ej: Guarenas - Las Acacias" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="coordinates">Coordenadas GPS</label>
                            <input type="text" id="coordinates" name="coordinates" placeholder="Ej: 10.4654, -66.6231">
                        </div>
                        <div class="form-group">
                            <label for="splitter-capacity">Capacidad del Splitter</label>
                            <select id="splitter-capacity" name="splitter_capacity">
                                <option value="8">1:8</option>
                                <option value="16" selected>1:16</option>
                                <option value="32">1:32</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="optical-power">Potencia Óptica (dBm)</label>
                            <input type="number" step="0.1" id="optical-power" name="optical_power" placeholder="Ej: -21.5">
                        </div>
                        <div class="form-group">
                            <label for="status">Estado Operativo</label>
                            <select id="status" name="status">
                                <option value="optimal">Óptimo</option>
                                <option value="warning">Atenuación Alta / Revisión</option>
                                <option value="critical">Crítico / Dañado</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="observations">Observaciones Técnicas</label>
                        <textarea id="observations" name="observations" rows="3" placeholder="Detalles de empalmes, estado de la roseta, precintos..."></textarea>
                    </div>

                    <button type="submit" class="btn-submit">Guardar Auditoría</button>
                </form>
            </section>
        </main>
    </div>

    <!-- Enlace correcto al archivo app.js -->
    <script src="app.js"></script>
</body>
</html>
